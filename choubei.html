<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂助手 · 抽背 + 点名</title>
<style>
  :root{
    --bg:#eef2f9; --card:#fff;
    --primary:#2563eb; --green:#16a34a; --red:#dc2626;
    --text:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --high:#10b981; --mid:#f59e0b; --low:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:14px;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  .wrap{max-width:1400px;margin:0 auto;}

  .topbar{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px; padding:0 4px;
  }
  .topbar h1{font-size:20px;margin:0;}
  .topbar .sub{font-size:13px;color:var(--muted);}

  .layout{
    display:grid; gap:14px;
    grid-template-columns:1fr;
  }
  @media (min-width:900px){
    .layout{grid-template-columns:2fr 1fr;}
  }

  .panel{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    box-shadow:0 6px 20px rgba(30,41,59,.07);
  }
  .panel h2{
    font-size:16px; margin:0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .panel h2 .ico{font-size:20px;}

  /* ============ 抽背 ============ */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:5px 11px;border-radius:999px;font-size:12px;
    cursor:pointer;transition:.15s;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

  .card{
    background:#fafafa;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    min-height:180px;
    display:flex; flex-direction:column;
    cursor:pointer;
  }
  .cardMeta{
    display:flex; justify-content:space-between;
    font-size:12px; color:var(--muted); margin-bottom:10px;
  }
  .cardMeta .tag{
    background:#eff6ff;color:#2563eb;
    padding:2px 10px;border-radius:999px;font-weight:600;
  }
  .q{font-size:17px;font-weight:600;line-height:1.7;flex:1;word-break:break-word;}
  .a{
    margin-top:14px;padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:16px;color:#047857;line-height:1.8;
    word-break:break-word;animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .row3 button{
    border:0;border-radius:10px;padding:11px 6px;
    font-size:14px;font-weight:600;color:#fff;cursor:pointer;
    transition:.15s;
  }
  .row3 button:active{transform:scale(.97);}
  .btnPrimary{background:var(--primary);}
  .btnGreen{background:var(--green);}
  .btnRed{background:var(--red);}

  .row3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .ghost{
    background:#fff;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:10px 6px;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .ghost.active{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600;}
  .ghost:disabled{opacity:.4;cursor:not-allowed;}

  .voiceRow{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;margin-top:8px;}
  .voiceRow button,.voiceRow select{
    padding:10px 6px; border-radius:10px;
    border:1px solid var(--line); background:#fff;
    color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .voiceRow button.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;}
  .voiceRow select{font-weight:400;}

  .stats{text-align:center;font-size:12px;color:var(--muted);margin:12px 0 4px;}
  details.wrongBox{
    margin-top:10px;background:#fafafa;
    border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;
  }
  details.wrongBox summary{
    cursor:pointer;font-weight:600;font-size:13px;
    outline:none;list-style:none;color:var(--text);
  }
  details.wrongBox summary::-webkit-details-marker{display:none;}
  details.wrongBox ul{list-style:none;padding:0;margin:8px 0 0;max-height:220px;overflow:auto;}
  details.wrongBox li{
    padding:8px 0;border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:flex-start;font-size:13px;
  }
  details.wrongBox li:first-child{border-top:0;}
  .wi{flex:1;}
  .wq{font-weight:600;}
  .wa{color:var(--muted);font-size:12px;margin-top:2px;}
  .mini{
    border:0;background:#fee2e2;color:#b91c1c;
    padding:4px 9px;border-radius:6px;font-size:11px;
    cursor:pointer;flex-shrink:0;
  }
  .mini.play{background:#dbeafe;color:#1d4ed8;margin-right:4px;}
  .empty{color:var(--muted);font-size:12px;padding:6px 0;}

  /* ============ 点名 ============ */
  .nameStage{
    background:linear-gradient(160deg,#1e3a8a,#0f172a);
    border-radius:14px;
    padding:24px 16px;
    min-height:220px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    color:#fff;
  }
  .nameBig{
    font-size:clamp(38px,8vw,72px);
    font-weight:800; letter-spacing:.06em;
    line-height:1.15; word-break:break-all;
    color:#fff;
  }
  .nameBig.rolling{color:#93c5fd;opacity:.9;}
  .nameBig.done{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{
    0%{transform:scale(.75);opacity:.3;}
    60%{transform:scale(1.06);}
    100%{transform:scale(1);opacity:1;}
  }
  .tierBadge{
    margin-top:12px;font-size:13px;font-weight:700;
    padding:4px 12px;border-radius:999px;
    letter-spacing:.05em;opacity:0;transition:opacity .25s;
  }
  .tierBadge.show{opacity:1;}
  .nameHint{margin-top:10px;font-size:13px;color:#94a3b8;min-height:18px;}

  .mainBtn{
    width:100%; margin-top:12px; padding:16px;
    font-size:19px; font-weight:800; letter-spacing:.1em;
    border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff;
    box-shadow:0 8px 22px rgba(37,99,235,.35);
    transition:.15s;
  }
  .mainBtn:active{transform:scale(.98);}
  .mainBtn.rolling{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 8px 22px rgba(220,38,38,.35);
  }

  .dmTools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .dmTools button{
    padding:10px 6px;border-radius:10px;
    border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:13px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .dmTools button.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;}

  .histLine{margin-top:12px;font-size:13px;color:var(--muted);}
  .histLine .lbl{font-weight:600;color:var(--text);}
  .histList{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chipHist{
    background:#f1f5f9;
    padding:4px 8px 4px 10px;
    border-radius:999px;
    font-size:12px;color:#334155;
    display:inline-flex; align-items:center; gap:6px;
    border-left:3px solid #94a3b8;
  }
  .chipHist button{
    border:0;background:transparent;color:#ef4444;
    cursor:pointer;font-size:14px;line-height:1;padding:0 2px;
  }

  details.dmSettings{
    margin-top:12px;background:#fafafa;
    border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;
  }
  details.dmSettings summary{
    cursor:pointer;font-weight:600;font-size:13px;
    outline:none;list-style:none;
  }
  details.dmSettings summary::-webkit-details-marker{display:none;}
  details.dmSettings summary::before{content:"▸ ";color:var(--muted);}
  details.dmSettings[open] summary::before{content:"▾ ";}

  .tierBlock{
    margin-top:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 12px;
  }
  .tierHead{
    display:flex; align-items:center; gap:10px;
    font-size:13px; font-weight:700;
    margin-bottom:8px;
  }
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .tierHead .tierLabel{flex:1;}
  .tierHead .wWrap{
    display:flex; align-items:center; gap:5px;
    font-size:12px; color:var(--muted); font-weight:400;
  }
  .tierHead input[type="number"]{
    width:52px;padding:4px 5px;
    border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--text);
    font-size:13px;font-weight:800;text-align:center;
  }
  .tierBlock textarea{
    width:100%;height:76px;
    padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);
    background:#fff;color:var(--text);
    font-size:13px;line-height:1.6;
    font-family:inherit;resize:vertical;
  }
  .tierBlock textarea:focus{outline:none;border-color:var(--primary);}
  .saveBtn{
    margin-top:10px;padding:10px 18px;
    border:0;border-radius:10px;
    background:var(--primary);color:#fff;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .saveBtn:active{transform:scale(.97);}
  .note{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>课堂助手 · 抽背 + 点名</h1>
    <span class="sub">湘教版七上 · 分层点名</span>
  </div>

  <div class="layout">

    <!-- ==================== 抽背 ==================== -->
    <section class="panel">
      <h2><span class="ico">📚</span>知识抽背</h2>

      <div class="chips" id="chips"></div>

      <div class="card" id="card">
        <div class="cardMeta">
          <span class="tag" id="qtag">—</span>
          <span id="qprogress"></span>
        </div>
        <div class="q" id="q">点击下方「下一题」开始抽背</div>
        <div class="a" id="a" hidden></div>
      </div>

      <div class="row3">
        <button class="btnPrimary" id="btnShow">显示答案</button>
        <button class="btnGreen" id="btnKnown">会了 ✓</button>
        <button class="btnRed" id="btnUnknown">不熟 ✗</button>
      </div>
      <div class="row3b">
        <button class="ghost" id="btnPrev">← 上一题</button>
        <button class="ghost" id="btnNext">下一题 →</button>
        <button class="ghost" id="btnWrongMode">只抽不熟</button>
      </div>
      <div class="voiceRow">
        <button id="btnVoice" class="on">🔊 语音开</button>
        <select id="rateSel">
          <option value="0.8">慢速</option>
          <option value="1" selected>正常</option>
          <option value="1.25">快速</option>
        </select>
        <button id="btnRepeat">🔁 重听</button>
      </div>

      <div class="stats" id="stats"></div>

      <details class="wrongBox">
        <summary>不熟清单 <span id="wrongCount"></span></summary>
        <ul id="wrongList"></ul>
      </details>
    </section>

    <!-- ==================== 点名 ==================== -->
    <section class="panel">
      <h2><span class="ico">🎯</span>分层随机点名</h2>

      <div class="nameStage">
        <div class="nameBig" id="dmName">准备开始</div>
        <div class="tierBadge" id="dmBadge"></div>
        <div class="nameHint" id="dmHint"></div>
      </div>

      <button class="mainBtn" id="dmMain">开 始 点 名</button>

      <div class="dmTools">
        <button id="dmMode">不重复</button>
        <button id="dmVoice" class="active">🔊 语音开</button>
        <button id="dmReset">重 置</button>
      </div>

      <div class="histLine">
        <span class="lbl">本轮记录：</span>
        <div class="histList" id="dmHist"></div>
      </div>

      <details class="dmSettings">
        <summary>名单与权重设置</summary>
        <div id="tierContainer"></div>
        <button class="saveBtn" id="dmSave">保存名单</button>
        <div class="note">
          <b>权重</b>越大越容易被抽中。默认「基础好=1，中等=4，中等偏下=4」，即中等和薄弱学生被抽中概率是基础好的 4 倍。名单每行一个名字，改完点保存。
        </div>
      </details>
    </section>

  </div>
</div>

<script>
/* ========================================================
   ================ 一、抽背模块（独立作用域） ================
   ======================================================== */
(function(){

const $ = id => document.getElementById(id);

/* -------- 题库 -------- */
const BANK = [
  /* 认识负数 */
   {chap:"认识负数", q:"什么是负数？举出三个例子。", a:"在正数前面加上“-”号的数叫做负数，如 -1、-2.5、-100。负数都比 0 小。"},
  {chap:"认识负数", q:"0 是正数还是负数？", a:"0 既不是正数，也不是负数，它是正数和负数的分界。"},
  {chap:"认识负数", q:"判断：一个数不是正数就是负数。", a:"错误。0 既不是正数也不是负数。"},
  {chap:"认识负数", q:"-a 一定是负数吗？", a:"不一定。a 大于 0 时 -a 是负数；a 等于 0 时 -a 等于 0；a 小于 0 时 -a 是正数。"},
  {chap:"认识负数", q:"向东走 8 米记作 +8 米，那么向西走 5 米记作什么？", a:"-5 米"},
  {chap:"认识负数", q:"零上 5 摄氏度记作 +5 摄氏度，那么零下 3 摄氏度记作什么？", a:"-3 摄氏度"},
  {chap:"认识负数", q:"收入 200 元记作 +200 元，那么支出 80 元记作什么？", a:"-80 元"},
  {chap:"认识负数", q:"水位上升 0.5 米记作 +0.5 米，那么 -0.3 米表示什么？", a:"水位下降 0.3 米"},
  {chap:"认识负数", q:"盈利 100 元记作 +100 元，那么 -50 元表示什么？", a:"亏损 50 元"},
  {chap:"认识负数", q:"向北走 -6 米的实际意义是什么？", a:"向南走 6 米"},
  {chap:"认识负数", q:"正数、0、负数的大小关系是什么？", a:"正数大于 0，0 大于负数。"},
  {chap:"认识负数", q:"在 -2、0、3.5、-1/2、-7 中，哪些是负数？", a:"-2、-1/2、-7 是负数。"},
  {chap:"认识负数", q:"食品包装上标“净重 500 ± 5 克”，表示什么意思？", a:"每袋食品的质量在 495 克到 505 克之间。"},
  {chap:"认识负数", q:"某天最高气温 3 摄氏度，最低气温 -5 摄氏度，这天的温差是多少？", a:"3 减 -5 等于 8，温差是 8 摄氏度。"},

  /* ---------- 有理数（新增） ---------- */
  {chap:"有理数", q:"什么是有理数？", a:"整数和分数统称有理数。"},
  {chap:"有理数", q:"有理数可以怎样分类？", a:"有两种分类方法。按定义分：整数和分数；按符号分：正有理数、0、负有理数。"},
  {chap:"有理数", q:"整数包括哪些数？", a:"正整数、0、负整数统称整数。"},
  {chap:"有理数", q:"分数包括哪些数？", a:"正分数和负分数统称分数。"},
  {chap:"有理数", q:"0 是有理数吗？", a:"是。0 是整数，整数属于有理数，所以 0 是有理数。"},
  {chap:"有理数", q:"判断：一个有理数不是整数就是分数。", a:"正确。有理数按定义分为整数和分数两大类。"},
  {chap:"有理数", q:"-3.5 是有理数吗？为什么？", a:"是。因为 -3.5 是负分数，而分数是有理数。"},
  {chap:"有理数", q:"正有理数包括哪些数？", a:"正整数和正分数。"},
  {chap:"有理数", q:"负有理数包括哪些数？", a:"负整数和负分数。"},
  {chap:"有理数", q:"有理数按符号分类分为哪几类？", a:"三类：正有理数、0、负有理数。"},
  {chap:"有理数", q:"判断：0 是正有理数。", a:"错误。0 既不是正有理数，也不是负有理数。"},
  {chap:"有理数", q:"最小的正整数是几？最大的负整数是几？", a:"最小的正整数是 1，最大的负整数是 -1。"},
  {chap:"有理数", q:"有没有最小的整数？有没有最小的有理数？", a:"都没有。整数和有理数都可以无限小，没有最小值。"},
  {chap:"有理数", q:"有限小数和无限循环小数是有理数吗？", a:"是。它们都可以化成分数，所以是有理数。"},
  {chap:"有理数", q:"圆周率 π 是有理数吗？", a:"不是。π 是无限不循环小数，不能化成分数，不是有理数。"},
  {chap:"有理数", q:"在 -7、0、3.14、-1/3、π、-0.5 中，哪些是有理数？", a:"-7、0、3.14、-1/3、-0.5 是有理数；π 不是有理数。"},
  {chap:"有理数", q:"有理数与数轴上的点有什么关系？", a:"每个有理数都可以用数轴上的一个点来表示；但数轴上的点不一定都表示有理数。"},
  {chap:"有理数", q:"自然数、整数、有理数三者之间有什么关系？", a:"自然数包含 0 和正整数；整数包含自然数和负整数；有理数包含整数和分数，范围依次扩大。"},
  {chap:"有理数", q:"把 -3、+2.5、0、7、-1 分类：哪些是整数？哪些是分数？", a:"整数：-3、0、7、-1；分数：+2.5。"},
  {chap:"有理数", q:"把 -3、+2.5、0、7、-1 分类：哪些是正有理数？哪些是负有理数？", a:"正有理数：+2.5、7；负有理数：-3、-1；0 既不是正有理数也不是负有理数。"},
  {chap:"有理数", q:"下列说法正确的是：A. 有理数不是正数就是负数；B. 0 是最小的有理数；C. 整数和分数统称有理数。", a:"选 C。A 错在漏了 0；B 错在没有最小的有理数。"},
  {chap:"有理数", q:"什么是非负数？什么是非正数？", a:"非负数指正数和 0；非正数指负数和 0。"},
  {chap:"有理数", q:"判断：无限小数都是无理数。", a:"错误。无限循环小数是有理数，只有无限不循环小数才是无理数。"},
  {chap:"有理数", q:"把下列各数填入相应的集合：-5、3.2、0、-2/7、-1、9。正整数集合、负分数集合分别有哪些？", a:"正整数：9；负分数：-2/7。其余 -5、-1 是负整数，3.2 是正分数，0 既不是正数也不是负数。"},

  /* ---------- 数轴 ---------- */
  {chap:"数轴", q:"什么是数轴？", a:"规定了原点、正方向、单位长度的直线叫做数轴。"},
  {chap:"数轴", q:"数轴的三要素是什么？", a:"原点、正方向、单位长度。"},
  {chap:"数轴", q:"画数轴时三要素可以缺少吗？", a:"不可以。原点、正方向、单位长度缺一不可。"},
  {chap:"数轴", q:"所有的有理数都能用数轴上的点表示吗？", a:"能。每个有理数都可以用数轴上唯一的一个点来表示。"},
  {chap:"数轴", q:"数轴上表示 -3 的点在原点的哪一边？离原点几个单位长度？", a:"在原点左边，距离原点 3 个单位长度。"},
  {chap:"数轴", q:"数轴上，右边的数总比左边的数怎么样？", a:"右边的数总比左边的数大。"},
  {chap:"数轴", q:"数轴上到原点距离等于 3 的点表示哪些数？", a:"3 和 -3。"},
  {chap:"数轴", q:"比较大小：-4 和 -1 谁大？", a:"-4 小于 -1。在数轴上 -1 在 -4 的右边。"},
  {chap:"数轴", q:"数轴上点 A 表示 -2，把它向右移动 5 个单位长度后表示什么数？", a:"-2 加 5 等于 3，表示 3。"},
  {chap:"数轴", q:"数轴上点 B 表示 3，把它向左移动 4 个单位长度后表示什么数？", a:"3 减 4 等于 -1，表示 -1。"},

  knownCount = Number(localStorage.getItem("mt_known_v1") || 0);

/* -------- 语音 -------- */
function speakTxt(text){
  if(!voiceOn) return;
  if(!("speechSynthesis" in window)) return;
  const t = toSpeech(text);
  if(!t) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "zh-CN";
  const vs = window.speechSynthesis.getVoices() || [];
  const v = vs.find(x=>/zh[-_]CN/i.test(x.lang)) || vs.find(x=>/^zh/i.test(x.lang));
  if(v) u.voice = v;
  u.rate = rate; u.pitch = 1; u.volume = 1;
  setTimeout(()=>window.speechSynthesis.speak(u), 60);
}
function stopSpeak(){
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function toSpeech(text){
  let t = String(text);
  t = t.replace(/[()（）\[\]【】]/g, "");
  t = t.replace(/±/g,"正负").replace(/℃/g,"摄氏度")
       .replace(/×/g,"乘").replace(/÷/g,"除以")
       .replace(/≥/g,"大于等于").replace(/≤/g,"小于等于")
       .replace(/≠/g,"不等于").replace(/≈/g,"约等于")
       .replace(/=/g,"等于").replace(/→/g,"得到")
       .replace(/²/g,"的平方").replace(/³/g,"的立方");
  t = t.replace(/\|([^|]+)\|/g,"$1的绝对值");
  t = t.replace(/-(\d+)\s*\/\s*(\d+)/g,"负$2分之$1");
  t = t.replace(/(\d+)\s*\/\s*(\d+)/g,"$2分之$1");
  t = t.replace(/-/g,function(m,offset,str){
    const before = str.slice(0,offset).replace(/\s+$/,"");
    if(before.length === 0) return "负";
    const last = before[before.length-1];
    if(/[0-9A-Za-z)\]}\）】]/.test(last)) return "减";
    return "负";
  });
  t = t.replace(/\+/g,function(m,offset,str){
    const before = str.slice(0,offset).replace(/\s+$/,"");
    if(before.length === 0) return "正";
    const last = before[before.length-1];
    if(/[0-9A-Za-z)\]}\）】]/.test(last)) return "加";
    return "正";
  });
  return t.replace(/\s+/g," ").trim();
}

/* -------- 存取 -------- */

    localStorage.setItem("mt_wrong_v1",JSON.stringify(wrongList));
    localStorage.setItem("mt_known_v1",String(knownCount));
  }catch(e){}
}
function shuffle(a){
  const r = a.slice();
  for(let i = r.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [r[i],r[j]] = [r[j],r[i]];
  }
  return r;
}
function esc(s){
  return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}

/* -------- 抽题 -------- */
function buildPool(){
  let items;
  if(mode === "wrong") items = wrongList.slice();
  else if(filter === "全部") items = BANK.slice();
  else items = BANK.filter(x=>x.chap === filter);
  pool = shuffle(items);
  pos = 0;
}

function renderCurrent(){
  if(!current) return;
  $("qtag").textContent = current.chap;
  $("qprogress").textContent = pos + " / " + pool.length;
  $("q").textContent = current.q;
  $("a").textContent = current.a;
  $("a").hidden = true;
  $("btnPrev").disabled = (pos <= 1);
  speakTxt(current.q);
}

function next(){
  if(!pool.length || pos >= pool.length) buildPool();
  if(!pool.length){
    current = null;
    $("qtag").textContent = "—";
    $("qprogress").textContent = "";
    $("q").textContent = mode === "wrong"
      ? "不熟清单是空的，先去抽几题吧～"
      : "该分类下暂无题目";
    $("a").hidden = true;
    $("btnPrev").disabled = true;
    stopSpeak();
    return;
  }
  current = pool[pos++];
  renderCurrent();
}

function prev(){
  if(!pool.length || !current) return;
  if(pos <= 1) return;
  pos -= 1;
  current = pool[pos - 1];
  renderCurrent();
}

function toggleAnswer(){
  if(!current) return;
  const willShow = $("a").hidden;
  $("a").hidden = !willShow;
  if(willShow) speakTxt(current.a);
  else stopSpeak();
}

function markKnown(){
  if(!current) return;
  knownCount++;
  const before = wrongList.length;
  wrongList = wrongList.filter(x=>x.q !== current.q);
  save();
  renderWrong();
  updateStats();
  if(mode === "wrong" && wrongList.length !== before) buildPool();
  next();
}

function markUnknown(){
  if(!current) return;
  if(!wrongList.some(x=>x.q === current.q)){
    wrongList.push({chap:current.chap, q:current.q, a:current.a});
  }
  save();
  renderWrong();
  updateStats();
  if(mode === "wrong") buildPool();
  next();
}

/* -------- 渲染 -------- */
function renderChips(){
  const box = $("chips");
  box.innerHTML = "";
  ["全部"].concat(CHAPTERS).forEach(ch=>{
    const b = document.createElement("button");
    b.className = "chip" + (ch === filter && mode === "normal" ? " active" : "");
    b.textContent = ch;
    b.onclick = ()=>{
      filter = ch; mode = "normal";
      $("btnWrongMode").classList.remove("active");
      buildPool(); renderChips(); next(); updateStats();
    };
    box.appendChild(b);
  });
}

function renderWrong(){
  const ul = $("wrongList");
  ul.innerHTML = "";
  $("wrongCount").textContent = wrongList.length ? "(" + wrongList.length + ")" : "";
  if(!wrongList.length){
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "暂无，继续保持！";
    ul.appendChild(li);
    return;
  }
  wrongList.forEach((item,i)=>{
    const li = document.createElement("li");
    const div = document.createElement("div");
    div.className = "wi";
    div.innerHTML =
      '<div class="wq">' + esc(item.q) + '</div>' +
      '<div class="wa">' + esc(item.a) + '</div>';

    const play = document.createElement("button");
    play.className = "mini play";
    play.textContent = "🔊";
    play.onclick = ()=>{
      const wasOn = voiceOn;
      voiceOn = true;
      speakTxt(item.q + "。" + item.a);
      voiceOn = wasOn;
    };

    const del = document.createElement("button");
    del.className = "mini";
    del.textContent = "移除";
    del.onclick = ()=>{
      wrongList.splice(i,1);
      save(); renderWrong(); updateStats();
      if(mode === "wrong"){ buildPool(); next(); }
    };

    li.appendChild(div); li.appendChild(play); li.appendChild(del);
    ul.appendChild(li);
  });
}

function updateStats(){
  $("stats").textContent =
    "已掌握 " + knownCount + " 题 · 不熟 " + wrongList.length +
    " 题 · 题库共 " + BANK.length + " 题";
}

/* -------- 事件 -------- */
$("btnShow").onclick = toggleAnswer;
$("btnNext").onclick = next;
$("btnPrev").onclick = prev;
$("btnKnown").onclick = markKnown;
$("btnUnknown").onclick = markUnknown;
$("card").onclick = toggleAnswer;

$("btnWrongMode").onclick = ()=>{
  mode = mode === "wrong" ? "normal" : "wrong";
  $("btnWrongMode").classList.toggle("active", mode === "wrong");
  buildPool(); renderChips(); next(); updateStats();
};
$("btnVoice").onclick = ()=>{
  voiceOn = !voiceOn;
  $("btnVoice").classList.toggle("on", voiceOn);
  $("btnVoice").textContent = voiceOn ? "🔊 语音开" : "🔇 语音关";
  if(!voiceOn) stopSpeak();
};
$("rateSel").onchange = e => { rate = Number(e.target.value); };
$("btnRepeat").onclick = ()=>{
  if(!current) return;
  const wasOn = voiceOn;
  voiceOn = true;
  speakTxt($("a").hidden ? current.q : current.q + "。" + current.a);
  voiceOn = wasOn;
};

/* 空格/方向键只在输入框外生效 */
document.addEventListener("keydown", e=>{
  const tag = e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(e.code === "Space"){ e.preventDefault(); toggleAnswer(); }
  else if(e.key === "1") markKnown();
  else if(e.key === "2") markUnknown();
  else if(e.key === "ArrowRight") next();
  else if(e.key === "ArrowLeft") prev();
});

document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) stopSpeak();
});

/* 启动 */
renderChips();
renderWrong();
updateStats();
buildPool();
next();

})();   /* ===== 抽背模块结束 ===== */

  TIER_DEFS.forEach(d=>{
    const ta = document.querySelector('textarea[data-tier="'+d.key+'"]');
    data[d.key] = (ta ? ta.value : "").split("\n").map(s=>s.trim()).filter(Boolean);
  });
  return data;
}

function getStudents(){
  const data = readEditors();
  const list = [];
  TIER_DEFS.forEach(d=>{
    (data[d.key]||[]).forEach(n=>list.push({name:n, tier:d.key}));
  });
  return list;
}

/* -------- 加权抽取 -------- */
function weightedPick(pool){
  if(!pool.length) return null;
  let total = 0;
  pool.forEach(s=>{ total += (weights[s.tier] || 0); });
  if(total <= 0) return pool[Math.floor(Math.random()*pool.length)];
  let r = Math.random() * total;
  for(const s of pool){
    r -= (weights[s.tier] || 0);
    if(r <= 0) return s;
  }
  return pool[pool.length-1];
}

function getPool(){
  const all = getStudents();
  if(!noRepeat) return all;
  const drawnNames = new Set(drawn.map(d=>d.name));
  return all.filter(s=>!drawnNames.has(s.name));
}

/* -------- 点名 -------- */
function startRoll(){
  rollPool = getPool();
  if(!rollPool.length){
    $("dmHint").textContent = getStudents().length
      ? "全班都抽过啦，点「重置」再来一轮"
      : "请先在下面「名单与权重设置」里填学生姓名";
    return;
  }
  rolling = true;
  $("dmMain").textContent = "停 止";
  $("dmMain").classList.add("rolling");
  $("dmName").classList.remove("done");
  $("dmName").classList.add("rolling");
  $("dmBadge").classList.remove("show");
  $("dmHint").textContent = "滚动中…点「停止」或稍等自动停";

  rollTimer = setInterval(()=>{
    const p = rollPool;
    if(!p || !p.length) return;
    const s = weightedPick(p);
    $("dmName").textContent = s.name;
  }, 65);

  autoTimer = setTimeout(stopRoll, 1000);
}

function stopRoll(){
  clearInterval(rollTimer);
  clearTimeout(autoTimer);
  rollTimer = autoTimer = null;
  rolling = false;

  $("dmMain").textContent = "开 始 点 名";
  $("dmMain").classList.remove("rolling");
  $("dmName").classList.remove("rolling");

  const pool = rollPool && rollPool.length ? rollPool : getPool();
  rollPool = null;

  if(!pool.length){
    $("dmName").textContent = "—";
    $("dmHint").textContent = "全班都抽过啦，点「重置」再来一轮";
    return;
  }

  const picked = weightedPick(pool);
  $("dmName").textContent = picked.name;
  $("dmName").classList.add("done");

  const def = TIER_DEFS.find(t=>t.key === picked.tier);
  const badge = $("dmBadge");
  if(def){
    badge.textContent = def.label + " · 权重 " + (weights[def.key]||0) + " 倍";
    badge.style.background = def.color + "26";
    badge.style.color = def.color;
    badge.style.border = "1px solid " + def.color + "66";
    badge.classList.add("show");
  }

  drawn.push(picked);
  saveState();
  renderHist();

  $("dmHint").textContent = "请 " + picked.name + " 同学回答问题";
  speak("请 " + picked.name + " 同学回答问题");
}

/* -------- 渲染 -------- */
function renderHist(){
  const box = $("dmHist");
  box.innerHTML = "";

  const seen = new Set();
  const uniq = [];
  drawn.forEach(d=>{
    if(!seen.has(d.name)){ seen.add(d.name); uniq.push(d); }
  });

  if(!uniq.length){
    const sp = document.createElement("span");
    sp.style.color = "#94a3b8";
    sp.textContent = "还没有抽过";
    box.appendChild(sp);
    return;
  }

  uniq.slice().reverse().forEach(d=>{
    const def = TIER_DEFS.find(t=>t.key === d.tier);
    const chip = document.createElement("span");
    chip.className = "chipHist";
    if(def) chip.style.borderLeftColor = def.color;
    chip.textContent = d.name;

    const b = document.createElement("button");
    b.textContent = "×";
    b.title = "从记录移除";
    b.onclick = ()=>{
      drawn = drawn.filter(x=>x.name !== d.name);
      saveState();
      renderHist();
    };
    chip.appendChild(b);
    box.appendChild(chip);
  });
}

/* -------- 生成设置面板 -------- */
function buildTierEditors(){
  const c = $("tierContainer");
  c.innerHTML = "";
  TIER_DEFS.forEach(def=>{
    const block = document.createElement("div");
    block.className = "tierBlock";
    block.innerHTML =
      '<div class="tierHead">' +
        '<span class="dot" style="background:'+def.color+'"></span>' +
        '<span class="tierLabel">'+def.label+'</span>' +
        '<span class="wWrap">权重 ' +
          '<input type="number" min="0" max="20" step="1" value="'+(weights[def.key]||0)+'" ' +
                 'data-weight="'+def.key+'"> 倍' +
        '</span>' +
      '</div>' +
      '<textarea data-tier="'+def.key+'" spellcheck="false" placeholder="每行一个名字"></textarea>';
    c.appendChild(block);
  });

  c.querySelectorAll("input[data-weight]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const k = inp.dataset.weight;
      let v = parseFloat(inp.value);
      if(!isFinite(v) || v < 0) v = 0;
      weights[k] = v;
      saveState();
    });
  });
}

function fillEditors(data){
  TIER_DEFS.forEach(def=>{
    const ta = document.querySelector('textarea[data-tier="'+def.key+'"]');
    if(ta) ta.value = (data[def.key]||[]).join("\n");
  });
}

function updateModeBtn(){
  const b = $("dmMode");
  b.classList.toggle("active", noRepeat);
  b.textContent = noRepeat ? "不重复 ✓" : "不重复";
}
function updateVoiceBtn(){
  const b = $("dmVoice");
  b.classList.toggle("active", voiceOn);
  b.textContent = voiceOn ? "🔊 语音开" : "🔇 语音关";
}

/* -------- 事件 -------- */
function bindEvents(){
  $("dmMain").onclick = ()=>{ if(rolling) stopRoll(); else startRoll(); };

  $("dmReset").onclick = ()=>{
    if(!confirm("确定清空本轮记录，重新开始吗？")) return;
    drawn = [];
    saveState();
    renderHist();
    $("dmName").textContent = "准备开始";
    $("dmName").classList.remove("done");
    $("dmBadge").classList.remove("show");
    $("dmHint").textContent = "设置好名单后点下方按钮开始";
  };

  $("dmMode").onclick = ()=>{
    noRepeat = !noRepeat;
    updateModeBtn();
    saveState();
  };

  $("dmVoice").onclick = ()=>{
    voiceOn = !voiceOn;
    updateVoiceBtn();
    if(!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    saveState();
  };

  $("dmSave").onclick = ()=>{
    saveState();
    renderHist();
    $("dmHint").textContent = "名单已保存";
  };

  /* 空格键：只点名 */
  document.addEventListener("keydown", e=>{
    const tag = e.target.tagName;
    if(tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;
    if(e.code === "Space"){
      e.preventDefault();
      if(rolling) stopRoll(); else startRoll();
    }
  });
}

/* -------- 启动 -------- */
const data = loadState();
buildTierEditors();
fillEditors(data);
updateModeBtn();
updateVoiceBtn();
bindEvents();
renderHist();

})();   /* ===== 点名模块结束 ===== */
</script>
</body>
</html>
